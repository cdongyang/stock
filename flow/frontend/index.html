<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>资金流向监控</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0d1117; color: #c9d1d9; padding: 16px; }
    #controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    select, input[type=date] { background: #161b22; color: #c9d1d9; border: 1px solid #30363d; padding: 6px 10px; border-radius: 6px; }
    #tier-chart  { width: 100%; height: 300px; }
    #kline-chart { width: 100%; height: 200px; margin-top: 8px; }
    #cum-chart   { width: 100%; height: 160px; margin-top: 8px; }
    #status { margin-top: 8px; font-size: 12px; color: #8b949e; }
  </style>
</head>
<body>
<div id="controls">
  <select id="stockSelect"></select>
  <input type="date" id="dateSelect">
</div>
<div id="tier-chart"></div>
<div id="kline-chart"></div>
<div id="cum-chart"></div>

<div id="status">等待数据...</div>

<script>
const tierChart  = echarts.init(document.getElementById('tier-chart'));
const klineChart = echarts.init(document.getElementById('kline-chart'));
const cumChart   = echarts.init(document.getElementById('cum-chart'));
function linkAxes(...charts) {
  let busy = false;
  charts.forEach(src => {
    src.on('updateAxisPointer', evt => {
      if (busy) return;
      const info = evt.axesInfo?.[0];
      if (info == null || info.value == null) return;
      const xPx = src.convertToPixel({ xAxisIndex: 0 }, info.value);
      if (xPx == null) return;
      busy = true;
      charts.forEach(dst => {
        if (dst === src) return;
        try { dst.dispatchAction({ type: 'showTip', x: xPx, y: dst.getHeight() / 2 }); }
        catch (_) {}
      });
      busy = false;
    });
    src.getZr().on('mouseout', () => {
      charts.forEach(dst => dst.dispatchAction({ type: 'hideTip' }));
    });
  });
}
linkAxes(tierChart, klineChart, cumChart);

function linkDataZoom(...charts) {
  let busy = false;
  charts.forEach(src => {
    src.on('datazoom', evt => {
      if (busy) return;
      const item = evt.batch?.[0] ?? evt;
      if (item.start == null || item.end == null) return;
      busy = true;
      charts.forEach(dst => {
        if (dst === src) return;
        dst.dispatchAction({ type: 'dataZoom', start: item.start, end: item.end });
      });
      busy = false;
    });
  });
}
linkDataZoom(tierChart, klineChart, cumChart);

let currentCode = '';
const SOURCE = 'plan_a';

const SERIES = [
  { name: '特大单净买入', field: 'main_net',  color: '#00c853' },
  { name: '大单净买入',   field: 'fat_net',   color: '#69f0ae' },
  { name: '中单净买入',   field: 'mid_net',   color: '#b9f6ca' },
  { name: '小单净买入',   field: 'small_net', color: '#e8f5e9' },
];

const _axisCommon = {
  type: 'category', data: [],
  axisLabel: { color: '#8b949e', rotate: 30 },
};

tierChart.setOption({
  backgroundColor: '#0d1117',
  tooltip: { trigger: 'axis', axisPointer: { type: 'cross' },
    formatter: params => {
      if (!params?.length) return '';
      let s = `<b>${params[0]?.axisValue}</b><br>`;
      params.forEach(p => {
        if (p && p.value != null) s += `${p.seriesName}: $${(p.value/1000).toFixed(1)}k<br>`;
      });
      return s;
    }
  },
  legend: { top: 4, textStyle: { color: '#8b949e' }, data: SERIES.map(s => s.name) },
  grid: { left: 70, right: 12, top: 52, bottom: 30 },
  xAxis: _axisCommon,
  yAxis: { type: 'value', name: 'USD', nameTextStyle: { color: '#8b949e' },
           axisLabel: { color: '#8b949e', formatter: v => '$'+(v/1000).toFixed(0)+'k' },
           splitLine: { lineStyle: { color: '#21262d' } } },
  dataZoom: [{ type: 'inside' }],
  series: SERIES.map(s => ({
    name: s.name, type: 'line', smooth: true, symbol: 'none',
    lineStyle: { color: s.color, width: 1.5 },
    itemStyle: { color: s.color }, data: []
  }))
});

klineChart.setOption({
  backgroundColor: '#0d1117',
  tooltip: { trigger: 'axis', axisPointer: { type: 'cross' },
    formatter: params => {
      if (!params?.length) return '';
      const p = params[0];
      if (!p || !Array.isArray(p.value)) return '';
      const [o, c, l, h] = p.value;
      return `<b>${p.axisValue}</b><br>O$${o.toFixed(2)} H$${h.toFixed(2)} L$${l.toFixed(2)} C$${c.toFixed(2)}`;
    }
  },
  legend: { top: 4, textStyle: { color: '#8b949e' }, data: ['K线'] },
  grid: { left: 70, right: 60, top: 36, bottom: 30 },
  dataZoom: [{ type: 'inside' }],
  xAxis: _axisCommon,
  yAxis: [
    { type: 'value', name: '价格', nameTextStyle: { color: '#8b949e' },
      axisLabel: { color: '#8b949e', formatter: v => '$'+v.toFixed(2) },
      splitLine: { lineStyle: { color: '#21262d' } }, scale: true },
    { type: 'value', name: '涨跌%', position: 'right', nameTextStyle: { color: '#8b949e' },
      axisLabel: { color: '#8b949e', formatter: v => v.toFixed(1)+'%' },
      splitLine: { show: false } },
  ],
  series: [{
    name: 'K线', type: 'candlestick', data: [],
    itemStyle: {
      color: '#f85149', color0: '#3fb950',
      borderColor: '#f85149', borderColor0: '#3fb950',
    },
  }]
});

cumChart.setOption({
  backgroundColor: '#0d1117',
  tooltip: { trigger: 'axis', axisPointer: { type: 'cross' },
    formatter: p => {
      if (!p?.length) return '';
      return `${p[0]?.axisValue}  累计净流入: $${((p[0]?.value||0)/1000).toFixed(1)}k`;
    }
  },
  grid: { left: 70, right: 12, top: 8, bottom: 60 },
  dataZoom: [
    { type: 'inside' },
    { type: 'slider', height: 20, bottom: 8,
      fillerColor: 'rgba(31,111,235,0.15)', borderColor: '#30363d',
      handleStyle: { color: '#58a6ff' }, textStyle: { color: '#8b949e' } },
  ],
  xAxis: _axisCommon,
  yAxis: { type: 'value', name: '累计(USD)', nameTextStyle: { color: '#8b949e' },
           axisLabel: { color: '#8b949e', formatter: v => '$'+(v/1000).toFixed(0)+'k' },
           splitLine: { lineStyle: { color: '#21262d' } } },
  series: [{ name: '累计净流入', type: 'line', smooth: true, symbol: 'none',
    lineStyle: { color: '#ff7c00', width: 2 },
    areaStyle: { color: 'rgba(255,124,0,0.08)' }, data: [] }]
});

function setStatus(msg) { document.getElementById('status').textContent = msg; }

function renderFlow(rows, klines = []) {
  // 以 flow 时间和 K 线时间的并集为统一 x 轴，延伸盘 K 线正常显示
  const flowMap = {};
  rows.forEach(r => { flowMap[r.minute.slice(11, 16)] = r; });
  const klineMap = {};
  klines.forEach(k => { klineMap[k.time.slice(11, 16)] = k; });
  const times = [...new Set([...Object.keys(flowMap), ...Object.keys(klineMap)])].sort();

  tierChart.setOption({
    xAxis: { data: times },
    series: SERIES.map(s => ({
      name: s.name,
      data: times.map(t => flowMap[t]?.[s.field] ?? null),
    }))
  });

  const klineData = times.map(t => {
    const k = klineMap[t];
    return k ? [k.open, k.close, k.low, k.high] : '-';
  });
  const realBars = klineData.filter(Array.isArray);
  const refPrice = realBars.length ? realBars[0][0] : null;
  const klineOpt = {
    xAxis: { data: times },
    series: [{
      name: 'K线', type: 'candlestick', data: klineData,
      itemStyle: {
        color: '#f85149', color0: '#3fb950',
        borderColor: '#f85149', borderColor0: '#3fb950',
      },
    }],
  };
  if (refPrice && realBars.length) {
    const allPrices = realBars.flatMap(([o, c, l, h]) => [o, c, l, h]);
    const lo = Math.min(...allPrices), hi = Math.max(...allPrices);
    const pad = (hi - lo) * 0.1 || hi * 0.01;
    klineOpt.yAxis = [
      { min: lo - pad, max: hi + pad },
      { min: lo - pad, max: hi + pad,
        axisLabel: { color: '#8b949e',
          formatter: v => `${((v - refPrice) / refPrice * 100).toFixed(1)}%` } },
    ];
  }
  klineChart.setOption(klineOpt);

  cumChart.setOption({
    xAxis: { data: times },
    series: [{ name: '累计净流入', data: times.map(t => flowMap[t]?.cum_net_flow ?? null) }]
  });
}

async function loadFlow() {
  const date = document.getElementById('dateSelect').value || null;
  const dp = date ? `&date=${date}` : '';
  const kp = date ? `?date=${date}` : '';
  const [rows, klines] = await Promise.all([
    fetch(`/api/flow/${currentCode}?source=${SOURCE}${dp}`).then(r => r.json()).catch(() => []),
    fetch(`/api/kline/${currentCode}${kp}`).then(r => r.json()).catch(() => []),
  ]);
  renderFlow(rows, klines);
  setStatus(`已加载 ${currentCode}`);
}

function connectWS() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => setStatus('WebSocket 已连接');
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'flow_update' && msg.code === currentCode) {
      loadFlow();
    }
  };
  ws.onclose = () => { setStatus('WebSocket 断开，3s 后重连...'); setTimeout(connectWS, 3000); };
}

async function loadStocks() {
  const sel = document.getElementById('stockSelect');
  const list = await fetch('/api/stocks').then(r => r.json())
    .catch(() => [{ code: 'US.OKLO', name: 'Oklo' }]);
  list.forEach(s => {
    const o = document.createElement('option');
    o.value = s.code; o.textContent = `${s.name} (${s.code})`;
    sel.appendChild(o);
  });
  currentCode = sel.value;
}

document.getElementById('stockSelect').addEventListener('change', e => {
  currentCode = e.target.value;
  loadFlow();
});
document.getElementById('dateSelect').addEventListener('change', () => {
  loadFlow();
});
setInterval(loadFlow, 30000);

async function initDate() {
  const dateInput = document.getElementById('dateSelect');
  if (dateInput.value) return;
  const res = await fetch(`/api/latest_date/${currentCode}?source=${SOURCE}`)
    .then(r => r.json()).catch(() => ({}));
  if (res.date) dateInput.value = res.date;
}

loadStocks().then(async () => { await initDate(); loadFlow(); connectWS(); });
</script>
</body>
</html>
